name: Refresh news daily

on:
  schedule:
    # 13:30 UTC ≈ 6:30am Pacific. Scheduled jobs run from the default branch.
    - cron: '30 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Avoid overlapping refreshes.
concurrency:
  group: news-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest youth soccer news
        run: node scripts/fetch-news.mjs

      - name: Fetch latest NorCal futsal news
        run: node scripts/fetch-futsal-news.mjs

      - name: Commit updated news (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/news.json data/futsal-news.json; then
            echo "No news changes today."
          else
            git add data/news.json data/futsal-news.json
            git commit -m "chore(news): daily refresh of soccer & futsal news"
            git push
            echo "Pushed updated news — Pages deploy will follow."
          fi
